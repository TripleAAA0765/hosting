{% extends 'base.html' %}

{% block title %}TripleAAA Games | Registro{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container auth-wrap">
        <div class="auth-card">
            <div class="auth-header">
                <span class="section-tag">Nueva cuenta</span>
                <h1>Registro</h1>
                <p>Crea tu perfil para jugar buscaminas.</p>
            </div>

            <form class="auth-form" method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Gmail</label>
                    <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmar contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
                </div>

                <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
                <p class="auth-alt">
                    ¿Ya tienes cuenta?
                    <a href="{{ url_for('login') }}">Inicia sesión</a>
                </p>
            </form>
        </div>
    </div>
</section>
{% endblock %}
