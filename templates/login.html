{% extends 'base.html' %}

{% block title %}TripleAAA Games | Login{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container auth-wrap">
        <div class="auth-card">
            <div class="auth-header">
                <span class="section-tag">Acceso</span>
                <h1>Iniciar sesión</h1>
                <p>Ingresa tu cuenta para continuar jugando.</p>
            </div>

            <form class="auth-form" method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email">Correo Gmail</label>
                    <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button class="btn btn-primary btn-block" type="submit">Entrar</button>
                <p class="auth-alt">
                    ¿No tienes cuenta?
                    <a href="{{ url_for('register') }}">Regístrate aquí</a>
                </p>
            </form>
        </div>
    </div>
</section>
{% endblock %}
